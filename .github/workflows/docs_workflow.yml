name: IElixir generate documentation

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      build_version:
        required: true
        type: string
      is_release:
        required: true
        type: string
    secrets:
      GH_TOKEN:
        required: true
      HEX_API_KEY:
        required: true

jobs:
  docs:
    name: Documentation and unit tests
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
    steps:
      - name: Checkout IElixir project
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set version
        if: inputs.is_release == 'true'
        run: |
          echo ${{ inputs.version }} > VERSION
      - name: Set build version
        if: inputs.is_release == 'false'
        run: |
          echo ${{ inputs.build_version }} > VERSION
      - name: Install prerequisites
        run: |
          sudo apt-get install -y openssl libncurses-dev
          sudo apt-get install -y libzmq3-dev libsqlite3-dev libssl-dev
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: 'OTP-29.1.3'
          elixir-version: 'v1.20.5-otp-29'
      - name: Generate documentation and run tests
        run: |
          MIX_ENV=docs mix deps.get
          MIX_ENV=test mix deps.get
          MIX_ENV=docs mix compile
          # Mix resets the code path, so expose the dependencies needed by these tasks.
          INCH_SKIP_REPORT=true MIX_ENV=docs mix run --no-start -e '
            Path.wildcard("_build/docs/lib/*/ebin")
            |> Enum.each(&Code.prepend_path/1)

            Mix.Task.run("docs")
            Mix.Task.run("inch.report")
          '
          MIX_ENV=test mix test
      - name: Publish documentation
        if: inputs.is_release == 'true'
        run: |
          mix hex.config api_key $HEX_API_KEY
          mix hex.publish package --yes
          MIX_ENV=docs mix hex.publish docs
